<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For ADU Students</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <div class="emoji" id="emoji">🤨</div>

      <p class="tag">⚠️ VERY IMPORTANT QUESTION</p>

      <h1 id="title">Where do you want to study?</h1>

      <p id="message">
        in which campus do you want to continue until it becomes safe to go to
        Adigrat University?
      </p>

      <div class="button-area" id="buttonArea">
        <button id="yesBtn">Adigrat University</button>
        <button id="noBtn">Hawassa University</button>
      </div>

      <p class="hint" id="hint">Choose wisely. Your reputation is at stake.</p>

      <div id="result" class="hidden">
        <div class="emoji">🏆💀</div>
        <h2>CONGRATULATIONS!</h2>
        <p id="punchline"></p>
        <button id="againBtn">Try Again 😂</button>
      </div>

      <footer>Made to expose your friends 🤝</footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
